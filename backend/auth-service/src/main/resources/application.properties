# Port this service runs on
server.port=8081

# Database connection settings.
# Each microservice gets its own database - this one uses "auth_service_db",
# employee-service uses a different one ("employee_service_db").
#
# The ${VAR:default} syntax means: use the environment variable VAR if it's
# set, otherwise fall back to the value after the colon. This lets anyone
# override the username/password/secret without editing this file (and
# without ever committing real credentials to git) - just set an
# environment variable with the same name before starting the app, e.g.
#   set DB_PASSWORD=my-real-password   (Windows)
#   export DB_PASSWORD=my-real-password (Mac/Linux)
spring.datasource.url=jdbc:mysql://localhost:3306/auth_service_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:omen}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ddl-auto=update means Hibernate automatically creates/updates the
# database tables to match our entity classes (like AppUser.java) - we
# don't have to write CREATE TABLE by hand while learning.
spring.jpa.hibernate.ddl-auto=update
# Prints the actual SQL Hibernate runs - handy for seeing what's going on.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- JWT (login token) settings ---
# This secret key must be the SAME in employee-service's application.properties.
# auth-service uses it to sign tokens, employee-service uses it to verify
# them - that way employee-service can trust a token without asking
# auth-service to double check it every time.
#
# Set a JWT_SECRET environment variable to override the default below in
# any real deployment - never rely on the checked-in default outside of
# local learning/demo use.
app.jwt.secret=${JWT_SECRET:ChangeThisToARandom256BitSecretKeySharedByBothServices}
# How long a login token stays valid, in milliseconds (3600000 ms = 1 hour).
