server.port=8081

# This service owns its own schema/database - a separate MySQL database
# from employee-service's "employee_service_db". Each microservice owns
# its own data.
spring.datasource.url=jdbc:mysql://localhost:3306/auth_service_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=omen
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# update = Hibernate creates/adjusts tables to match AppUser.java automatically.
# Handy for learning; in a real project you'd use validate + migrations instead.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# No manual dialect needed - Hibernate auto-detects MySQL from the driver/URL.

# --- JWT settings ---
# IMPORTANT: this secret must be IDENTICAL to the one in employee-service's
# application.properties. Both services use the same symmetric key: auth-service
# signs tokens with it, employee-service verifies signatures with it - no network
# call between the two services is needed to check a token.
# DEMO VALUE ONLY - load from an environment variable in any real deployment:
#   app.jwt.secret=${JWT_SECRET}
app.jwt.secret=ChangeThisToARandom256BitSecretKeySharedByBothServices
app.jwt.expiration-ms=3600000
