# Port this service runs on:
#   auth-service       -> 8081
#   employee-service    -> 8082
#   inventory-service   -> 8083
#   donation-service     -> 8084
#   chatbot-service       -> 8085 (this one)
server.port=8085

# Where your local Ollama server is running, and which model to use.
# Override with env vars if your setup is different, e.g. a different
# model name than what you've pulled with "ollama pull <name>".
ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:llama3.2}

# Where inventory-service is running - the chatbot calls its GET
# /api/inventory (forwarding the caller's own JWT) to ground answers in
# real stock levels instead of the model guessing numbers.
inventory.base-url=${INVENTORY_BASE_URL:http://localhost:8083}

# --- JWT (login token) settings ---
# Must be exactly the same value as auth-service's app.jwt.secret.
app.jwt.secret=${JWT_SECRET:ChangeThisToARandom256BitSecretKeySharedByBothServices}
