# Port this service runs on:
#   auth-service       -> 8081
#   employee-service    -> 8082
#   inventory-service   -> 8083
#   donation-service     -> 8084 (this one)
server.port=8084

spring.datasource.url=jdbc:mysql://localhost:3306/donation_service_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:omen}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- JWT (login token) settings ---
# Must be exactly the same value as auth-service's app.jwt.secret.
app.jwt.secret=${JWT_SECRET:ChangeThisToARandom256BitSecretKeySharedByBothServices}
app.jwt.expiration-ms=3600000
