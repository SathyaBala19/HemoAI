server.port=8082

spring.datasource.url=jdbc:mysql://localhost:3306/employee_service_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=omen
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# update = Hibernate creates/adjusts tables to match Employee.java automatically.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# No manual dialect needed - Hibernate auto-detects MySQL from the driver/URL.

# --- JWT settings ---
# MUST match auth-service's app.jwt.secret exactly - that shared value is what
# lets this service verify a token it never issued and never calls auth-service to check.
app.jwt.secret=ChangeThisToARandom256BitSecretKeySharedByBothServices
app.jwt.expiration-ms=3600000
