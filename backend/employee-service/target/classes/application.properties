# Port this service runs on (different from auth-service's 8081, so both
# can run on the same machine at the same time).
server.port=8082

# This service has its own database, separate from auth-service's.
#
# ${VAR:default} means: use environment variable VAR if it's set, otherwise
# use the value after the colon. Override these with real env vars in any
# deployment instead of editing this file directly.
spring.datasource.url=jdbc:mysql://localhost:3306/employee_service_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:omen}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate will create/update the EMPLOYEES table automatically to
# match Employee.java.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- JWT (login token) settings ---
# This MUST be exactly the same value as auth-service's app.jwt.secret -
# same env var name (JWT_SECRET) so both services pick up the same
# override automatically.
app.jwt.secret=${JWT_SECRET:ChangeThisToARandom256BitSecretKeySharedByBothServices}
app.jwt.expiration-ms=3600000
