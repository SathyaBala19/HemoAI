# Port this service runs on. Each backend service gets its own port so
# they can all run on the same machine at once:
#   auth-service       -> 8081
#   employee-service    -> 8082
#   inventory-service   -> 8083 (this one)
server.port=8083

# This service has its own database, separate from the other two.
spring.datasource.url=jdbc:mysql://localhost:3306/inventory_service_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:omen}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate creates/updates the BLOOD_INVENTORY table automatically to
# match BloodInventory.java.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- JWT (login token) settings ---
# Must be exactly the same value as auth-service's app.jwt.secret - that's
# what lets this service check a token it never issued.
app.jwt.secret=${JWT_SECRET:ChangeThisToARandom256BitSecretKeySharedByBothServices}
app.jwt.expiration-ms=3600000
